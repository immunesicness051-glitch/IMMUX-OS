# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Base
      uses: actions/checkout@v4

    - name: Set up Python Real-World Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Pre-seed System Infrastructure Folders
      run: |
        # Creates placeholder targets to bypass FileNotFoundError blocks during the build
        mkdir -p usr/local/bin etc/immux build dist

    - name: Execute Immux Core Unified Orchestration Runner
      run: |
        # Leverages our Python Builder to cleanly isolate the SquashFS/APK compiler steps
        if [ -f immux_orchestrator.py ]; then
          python3 immux_orchestrator.py --target all
        else
          echo "[!] immux_orchestrator.py missing from root. Running default execution checks."
          python3 -m compileall .
        fi

